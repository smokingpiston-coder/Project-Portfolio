# Netlify builds and hosts the portfolio website for free.
# Every push to main rebuilds the site from the READMEs (about a minute).

[build]
  command = "pip install -r website/requirements.txt && python website/build.py --out _site"
  publish = "_site"

[build.environment]
  PYTHON_VERSION = "3.12"
  SITE_BASE_PATH = "/"

# Pull-request previews get their own temporary address, so you can check
# changes before they go live.
[context.deploy-preview]
  command = "pip install -r website/requirements.txt && python website/build.py --out _site"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
